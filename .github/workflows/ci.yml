name: MonoPulse CI Quality Gates & API Suite

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  quality-gates-and-api-tests:
    name: Quality Gates, Typecheck, Unit & API Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript compiler check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run ESLint static analysis
        run: npm run lint:eslint

      - name: Run dedicated HTTP & JSON-RPC API test suite
        run: npm run test:api

      - name: Run full Vitest automated test suite
        run: npm run test

      - name: Verify reproducible production build
        run: npm run build
