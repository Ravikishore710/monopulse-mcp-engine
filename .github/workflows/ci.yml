name: CI Quality Gates & Build Reproducibility

on:
  push:
    branches: [main, master, '*']
  pull_request:
    branches: [main, master, '*']

env:
  MONOPULSE_FORCE_SIMULATION: 'true'

jobs:
  build-and-test:
    name: Install, Audit, Typecheck, Coverage & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run automated secret scanning
        run: |
          if grep -RInE "(ghp_[A-Za-z0-9]{36}|xoxb-[0-9]{10,}|AIza[0-9A-Za-z-_]{35}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" src tests server.ts cli.ts; then
            echo "Hardcoded secret pattern detected!"
            exit 1
          fi

      - name: Run TypeScript typecheck (tsc)
        run: npx tsc --noEmit

      - name: Run ESLint static analysis (eslint)
        run: npx eslint src server.ts cli.ts --max-warnings=0

      - name: Run automated test suite (vitest)
        run: npx vitest run

      - name: Run coverage with threshold (vitest coverage)
        run: npx vitest run --coverage

      - name: Enforce >= 70% per-file line coverage for src/server/*.ts
        run: |
          node -e '
            const fs = require("node:fs");
            const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
            const failed = [];
            for (const [file, metrics] of Object.entries(summary)) {
              if (file.includes("/src/server/") && file.endsWith(".ts")) {
                const pct = metrics.lines.pct;
                if (pct < 70) failed.push(`${file}: ${pct}% (< 70%)`);
              }
            }
            if (failed.length > 0) {
              console.error("Per-file server coverage gate failed:\n" + failed.join("\n"));
              process.exit(1);
            }
            console.log("Verified all src/server/*.ts files exceed 70% line coverage.");
          '

      - name: Run API integration test suite
        run: npm run test:api

      - name: Verify reproducible production build
        run: npm run build

  cold-clone-smoke-test:
    name: Cold-Clone Reproducibility Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Execute cold-clone smoke-test script
        env:
          CLEAN_NODE_MODULES: 'true'
          MONOPULSE_FORCE_SIMULATION: 'true'
        run: bash scripts/smoke-test.sh

  deploy-release-bundle:
    name: Package & Verify Production Release Artifact
    needs: [build-and-test, cold-clone-smoke-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install production & build dependencies
        run: npm ci

      - name: Build production client bundle
        run: npm run build

      - name: Verify health & stress-test harness pre-deploy
        run: npm run test:load
