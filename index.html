    <script>
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function MockViteWebSocket(url, protocols) {
          var target = new EventTarget();
          var self = this;
          this.url = url;
          this.protocol = Array.isArray(protocols) ? protocols[0] || '' : protocols || '';
          this.readyState = 1;
          this.bufferedAmount = 0;
          this.extensions = '';
          this.binaryType = 'blob';
          this.onopen = null;
          this.onerror = null;
          this.onclose = null;
          this.onmessage = null;
          this.addEventListener = target.addEventListener.bind(target);
          this.removeEventListener = target.removeEventListener.bind(target);
          this.dispatchEvent = target.dispatchEvent.bind(target);
          this.send = function () {};
          this.close = function () {
            self.readyState = 3;
          };
          setTimeout(function () {
            var openEvt = new Event('open');
            if (typeof self.onopen === 'function') self.onopen(openEvt);
            self.dispatchEvent(openEvt);
            var msgEvt = new MessageEvent('message', {
              data: JSON.stringify({ type: 'connected' })
            });
            if (typeof self.onmessage === 'function') self.onmessage(msgEvt);
            self.dispatchEvent(msgEvt);
          }, 10);
        }
        var WrappedWebSocket = function (url, protocols) {
          var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          if (protoStr.indexOf('vite') !== -1 || String(url || '').indexOf('vite') !== -1) {
            return new MockViteWebSocket(url, protocols);
          }
          return protocols !== undefined
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);
        };
        WrappedWebSocket.CONNECTING = 0;
        WrappedWebSocket.OPEN = 1;
        WrappedWebSocket.CLOSING = 2;
        WrappedWebSocket.CLOSED = 3;
        WrappedWebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket = WrappedWebSocket;
      })();
    </script>
